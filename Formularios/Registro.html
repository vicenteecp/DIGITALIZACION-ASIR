<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<form action="registro.php" method="get">
    <h1><b>Registro de Usuario Nuevo</b></h1>
    <hr>
    <p><b>Nombre</b></p><br>
    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre"><br>
    <p><b>Apellido</b></p><br>
    <label for="apellido">Apellido</label>
    <input type="text" name="apellido" id="apellido"><br>
    <p><b>Email</b></p><br>
    <label for="email">Email</label>
    <input type="email" name="email" id="email"><br>
    <p><b>Contraseña</b></p><br>
    <label for="contrasena">Contraseña</label>
    <input type="password" name="password" id="contrasena"><br>
    <p><b>Repetir Contraseña</b></p>
    <label for="repcontrasena">Repetir contraseña</label>
    <input type="password" name="password" id="repcontrasena"><br><br>
    <input type="checkbox" required value="Acepta" id="condicion"/> <label for="condicion">Acepto los términos y condiciones</label><br><br>
    <input type="submit" value="Registrar" style="box-shadow-color: #953b39">

</form>
</body>
</html>
