<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
        }
        thead{
            background-color: #EDEDED;
        }

        tbody th{
            background-color: #5ba8f3;
            text-align: left;
        }

         tbody tr:nth-child(odd) td{
             background-color: #efea9e;
         }

         td,th{
             border: 1px solid black;
             padding: 5px;
         }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Cambio</th>
                <th>Compra</th>
                <th>Venta</th>
                <th>Máximo</th>
                <th>Mínimo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th><img src="imagenesEjercicio4/euro.png" alt="">Euro/Dolar</th>
                <td>1.2524</td>
                <td>1.2527</td>
                <td>1.2539</td>
                <td>1.2488</td>
            </tr>
            <tr>
                <th><img src="imagenesEjercicio4/dolar.png" alt="">Dolar/Yen</th>
                <td>119.01</td>
                <td>119.05</td>
                <td>119.82</td>
                <td>119.82</td>
            </tr>
            <tr>
                <th><img src="imagenesEjercicio4/libra.png" alt="">Libra/Dolar</th>
                <td>1.8606</td>
                <td>1.8611</td>
                <td>1.8651</td>
                <td>1.8522</td>
            </tr>
            <tr>
                <th><img src="imagenesEjercicio4/yen.png" alt="">Yen/Euro</th>
                <td>0.6711</td>
                <td>0.6705</td>
                <td>0.6676</td>
                <td>0.6713</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
